apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-config
  namespace: togglemaster
data:
  PORT: "8005"
  AWS_REGION: "us-east-1"
  AWS_SQS_URL: "https://sqs.us-east-1.amazonaws.com/090985516911/evaluation-events-queue"
  AWS_DYNAMODB_TABLE: "analytics-data" # Nome real da tabela que você criou na AWS
---
apiVersion: v1
kind: Secret
metadata:
  name: analytics-secret
  namespace: togglemaster
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "SUA_KEY_DO_AWS_DETAILS"
  AWS_SECRET_ACCESS_KEY: "SUA_SECRET_DO_AWS_DETAILS"
  AWS_SESSION_TOKEN: "SEU_SESSION_TOKEN_GIGANTE_DO_AWS_DETAILS"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: togglemaster
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
      - name: analytics-service
        image: 090985516911.dkr.ecr.us-east-1.amazonaws.com/togglemaster/analytics-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8005
        env:
        - name: PORT
          value: "8005"
        - name: AWS_REGION
          valueFrom:
            configMapKeyRef: { name: analytics-config, key: AWS_REGION }
        - name: AWS_SQS_URL
          valueFrom:
            configMapKeyRef: { name: analytics-config, key: AWS_SQS_URL }
        - name: AWS_DYNAMODB_TABLE
          valueFrom:
            configMapKeyRef: { name: analytics-config, key: AWS_DYNAMODB_TABLE}
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef: { name: analytics-secret, key: AWS_ACCESS_KEY_ID }
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef: { name: analytics-secret, key: AWS_SECRET_ACCESS_KEY }
        - name: AWS_SESSION_TOKEN
          valueFrom:
            secretKeyRef: { name: analytics-secret, key: AWS_SESSION_TOKEN }
        resources:
          limits: { cpu: "500m", memory: "256Mi" }
          requests: { cpu: "100m", memory: "128Mi" }
        livenessProbe:
          httpGet: { path: /health, port: 8005 }
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet: { path: /health, port: 8005 }
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: togglemaster
spec:
  type: ClusterIP
  selector:
    app: analytics-service
  ports:
  - port: 8005
    targetPort: 8005
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: analytics-service-hpa
  namespace: togglemaster
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: analytics-service }
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
