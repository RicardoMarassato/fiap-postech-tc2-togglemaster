apiVersion: v1
kind: ConfigMap
metadata:
  name: targeting-config
  namespace: togglemaster
data:
  PORT: "8003"
  AUTH_SERVICE_URL: "http://auth-service:8001"
---
apiVersion: v1
kind: Secret
metadata:
  name: targeting-secret
  namespace: togglemaster
type: Opaque
stringData:
  DATABASE_URL: "postgres://postgres:postgres@targeting-db.ciyhc63gtdsw.us-east-1.rds.amazonaws.com:5432/targeting_db?sslmode=require"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting-service
  namespace: togglemaster
spec:
  replicas: 2
  selector:
    matchLabels:
      app: targeting-service
  template:
    metadata:
      labels:
        app: targeting-service
    spec:
      containers:
      - name: targeting-service
        image: 090985516911.dkr.ecr.us-east-1.amazonaws.com/togglemaster/targeting-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8003
        env:
        - name: PORT
          value: "8003"
        - name: AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef: { name: targeting-config, key: AUTH_SERVICE_URL }
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef: { name: targeting-secret, key: DATABASE_URL }
        resources:
          limits: { cpu: "500m", memory: "256Mi" }
          requests: { cpu: "100m", memory: "128Mi" }
        livenessProbe:
          httpGet: { path: /health, port: 8003 }
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet: { path: /health, port: 8003 }
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: targeting-service
  namespace: togglemaster
spec:
  type: ClusterIP
  selector:
    app: targeting-service
  ports:
  - port: 8003
    targetPort: 8003
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: targeting-service-hpa
  namespace: togglemaster
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: targeting-service }
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
